limits:
  max_nesting: 3
  cyclomatic_complexity_warn: 6
  cyclomatic_complexity_error: 8
  max_imports: 15
  max_functions_per_file: 16
  max_function_lines: 80
  max_function_arguments: 3
  max_type_fields: 12
  max_hidden_touch_excess: 2
  max_lifecycle_flags: 2
  max_line_length: 120
  max_excerpt_lines: 12
  max_excerpt_chars: 1600
scan:
  extensions: [".go", ".ts", ".tsx", ".py", ".rs", ".zig"]
  ignored_dirs: [".git", ".zig-cache", "zig-out", "node_modules", "vendor", "dist", "build", "__pycache__"]
go:
  ban_interface_empty: true
  ban_map_string_interface_empty: true
  warn_type_switch: true
  ban_unchecked_type_assertions: true
  ban_generics: true
  surface_scope: "public_only"
  generic_scope: "public_only"
  extra_banned_patterns:
    - pattern: "unsafe.Pointer"
      severity: "warn"
      message: "unsafe.Pointer should be rare and documented"
typescript:
  ban_any: true
  ban_as_any: true
  ban_ts_ignore: true
  warn_ts_expect_error: true
  extra_banned_patterns:
    - pattern: "console.log"
      severity: "warn"
      message: "remove console logging before submission"
python:
  ban_type_ignore: true
  warn_import_any: true
  ban_any_annotation: true
  warn_bare_dict: true
  warn_bare_list: true
  warn_missing_return_annotation: true
  extra_banned_patterns: []
rust:
  ban_unsafe: true
  ban_dangerous_macros: true
  ban_clone: true
  warn_unwrap: true
  warn_expect: true
  warn_unwrap_err: true
  warn_transmute: true
  warn_static_mut: true
  warn_raw_pointer: true
  warn_allow: true
  warn_box_leak: true
  extra_banned_patterns: []
zig:
  warn_ptr_cast: true
  warn_int_cast: true
  warn_anytype: true
  anytype_scope: "public_only"
  cast_scope: "public_only"
  extra_banned_patterns:
    - pattern: "page_allocator"
      severity: "warn"
      message: "page_allocator should not be used in production hot paths"
audit:
  warn_ignored_errors: true
  warn_panic_paths: true
  warn_debug_output: true
  warn_risky_conversions: true
  warn_broad_exceptions: true
  warn_mutable_defaults: true
  warn_floating_promises: true
  warn_non_null_assertions: true
  warn_unpaired_resources: true
  warn_unpaired_locks: true
  warn_async_in_loops: true
  warn_eval: true
  warn_shell_execution: true
  warn_sql_string_building: true
  warn_untested_public_api: true
  score_threshold: 70
proof:
  commands:
    - name: unit
      argv: ["zig", "build", "test", "--summary", "all"]
      timeout_ms: 120000
      max_output_bytes: 65536
  reports: []
overrides:
  - path_prefixes: ["src/analyzers/", "src/protocol/"]
    limits:
      max_functions_per_file: 30
      max_function_lines: 120
      max_function_arguments: 8
      max_line_length: 160
      cyclomatic_complexity_warn: 10
      cyclomatic_complexity_error: 14
  - path_suffixes: ["src/types.zig"]
    limits:
      max_functions_per_file: 18
      max_nesting: 5
      max_function_lines: 240
      max_type_fields: 16
      cyclomatic_complexity_warn: 32
      cyclomatic_complexity_error: 48
  - path_suffixes: ["src/analyzers/type_check.zig"]
    limits:
      max_functions_per_file: 60
  - path_suffixes: ["src/config.zig"]
    limits:
      max_functions_per_file: 30
      max_function_arguments: 8
      cyclomatic_complexity_warn: 8
      cyclomatic_complexity_error: 12
      max_nesting: 4
  - path_suffixes: ["src/config_schema.zig"]
    limits:
      max_function_arguments: 6
      max_type_fields: 16
      max_hidden_touch_excess: 4
  - path_suffixes: ["src/symbol_model.zig"]
    limits:
      max_functions_per_file: 150
      max_function_arguments: 10
      max_type_fields: 16
      max_hidden_touch_excess: 12
      max_nesting: 6
      cyclomatic_complexity_warn: 10
      cyclomatic_complexity_error: 14
      max_line_length: 160
  - path_suffixes: ["src/config_loader.zig"]
    limits:
      max_functions_per_file: 28
  - path_suffixes: ["src/cli.zig", "src/analyzer.zig", "src/app.zig", "src/source_files.zig", "src/reporting.zig"]
    limits:
      max_function_arguments: 6
      max_functions_per_file: 32
      cyclomatic_complexity_warn: 10
      cyclomatic_complexity_error: 14
  - path_suffixes: ["src/audit.zig"]
    limits:
      max_function_arguments: 8
      max_functions_per_file: 48
      max_hidden_touch_excess: 10
      cyclomatic_complexity_warn: 12
      cyclomatic_complexity_error: 18
      max_line_length: 160
  - path_suffixes: ["src/root.zig", "src/yaml_config.zig", "src/types.zig"]
    limits:
      max_function_arguments: 8
      max_functions_per_file: 48
      cyclomatic_complexity_warn: 12
      cyclomatic_complexity_error: 16
      max_line_length: 160
  - path_suffixes: ["src/analyzers/complexity.zig"]
    limits:
      max_functions_per_file: 36
  - path_suffixes: ["src/types.zig"]
    limits:
      max_function_lines: 240
      cyclomatic_complexity_warn: 32
      cyclomatic_complexity_error: 48
  - roles: ["test", "fixture", "sample"]
    limits:
      max_function_lines: 90
      max_line_length: 160
    go:
      ban_generics: false
    zig:
      warn_anytype: false
    audit:
      warn_debug_output: false
      warn_panic_paths: false
